name: Pull kicker stats (one-off)

on:
  push:
    paths:
      - 'scripts/fetch_kickers.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull kicker stats from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/fetch_kickers.py
      - name: Save
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kickers-2026.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Save 2026 kicker stats"
          git pull --rebase
          git push
