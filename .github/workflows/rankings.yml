name: Post power rankings

on:
  push:
    paths:
      - 'rankings/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the rankings list
        run: python3 scripts/build_rankings.py
      - name: Save if anything changed
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update power rankings list"
          git pull --rebase
          git push
